<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Bobby Abdurrahman Haris"><meta name="theme-color" content="#0b2a63"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="日本語の扉 N2"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>日本語の扉 · Bunpou & Kanji</title>
<style>
:root{--bg:#f4f7fc;--c:#fff;--tx:#0d1b3d;--mu:#5b6785;--bd:#dce3f0;--pk:#f2457a;--bl:#1f5aa6;--gr:#1fae84;--or:#e07b00;--pu:#2a55a3;--soft:#ffe8f0;--hd:#0b2a63;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--c:#141c36;--tx:#eaf0ff;--mu:#a3b0d0;--bd:#263259;--soft:#33203a;--hd:#0c1d4a;--pk:#ff6b9a;--bl:#7fb0ff;--pu:#8fb2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1226;--c:#141c36;--tx:#eaf0ff;--mu:#a3b0d0;--bd:#263259;--soft:#33203a;--hd:#0c1d4a;--pk:#ff6b9a;--bl:#7fb0ff;--pu:#8fb2ff;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
header b{font-size:18px}header small{display:block;font-size:11px;opacity:.9}
#mb{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:12px;width:42px;height:38px;display:grid;place-items:center;padding:0}
main{max-width:720px;margin:0 auto;padding:14px 14px 96px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--c);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a,nav button{flex:1;background:none;border:0;font-family:inherit;cursor:pointer;text-align:center;padding:8px 2px;color:var(--mu);text-decoration:none;font-size:11px}
nav a span,nav button span{display:block;font-size:19px;line-height:1.2}
nav a.on,nav button.on{color:var(--pk);font-weight:700}
#mpop{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;display:flex;gap:10px;align-items:flex-end;pointer-events:none}
#mpop a{width:66px;height:66px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c);border:1px solid var(--bd);box-shadow:0 6px 18px rgba(0,0,0,.3);color:var(--tx);text-decoration:none;font-size:11px;line-height:1.2;opacity:0;transform:translateY(18px) scale(.5);transition:opacity .18s,transform .22s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#mpop a:nth-child(1),#mpop a:nth-child(4){--dy:14px}
#mpop.on a{opacity:1;pointer-events:auto;transform:translateY(var(--dy,0)) scale(1)}
#mpop.on a:nth-child(2){transition-delay:.03s}#mpop.on a:nth-child(3){transition-delay:.06s}#mpop.on a:nth-child(4){transition-delay:.09s}
#mpop a span{font-size:22px;line-height:1.1}
#mpop a.on{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700}
input[type=search],select{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--c);color:var(--tx);font-size:16px;margin-bottom:10px}
details{background:var(--c);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px}
details>summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details.g>summary{font-weight:700;color:var(--pk)}
details.g>summary small{margin-left:auto;color:var(--mu);font-weight:400}
details.g>div{padding:0 10px 4px}
.no{background:var(--pk);color:#fff;border-radius:50%;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ok{color:var(--gr);font-style:normal;margin-left:auto}
.bd{padding:2px 14px 14px}
.bd p{margin:6px 0}.bd em{font-style:normal;font-weight:700;color:var(--bl);margin-right:6px}
.ex{background:var(--soft);border-radius:10px;padding:6px 10px;margin:8px 0;font-size:17px;line-height:2}
.ex i{display:block;font-size:13px;color:var(--mu);line-height:1.4;padding-bottom:4px}
.nt{font-size:14px;color:var(--mu)}
rt{font-size:.5em}
.btn{background:var(--pk);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600}
.btn.alt{background:var(--c);color:var(--tx);border:1px solid var(--bd)}
.btn.g{background:var(--gr)}.btn.o{background:var(--or)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;padding:2px 0 10px}
.tile{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:8px 2px;font-size:28px;color:var(--tx);line-height:1.2}
.tile small{display:block;font-size:10px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.tile.dn{background:var(--soft);border-color:var(--gr)}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet>div{background:var(--c);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.big{font-size:72px;line-height:1.1;text-align:center;color:var(--pk)}
.row{margin:6px 0;font-size:15px}.row em{font-style:normal;font-weight:700;color:var(--pu);margin-right:6px}
.kv{display:inline-block;background:var(--soft);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:15px}
.fc{background:var(--c);border:2px solid var(--bd);border-radius:22px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;margin:10px 0;cursor:pointer}
.fc .big{font-size:96px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--gr)}
.opt{display:block;width:100%;text-align:left;background:var(--c);border:2px solid var(--bd);color:var(--tx);border-radius:14px;padding:13px 14px;margin:8px 0;font-size:17px}
.opt.right{border-color:var(--gr);background:rgba(31,174,132,.15)}.opt.bad{border-color:var(--pk);background:rgba(255,92,147,.15)}
.q{font-size:20px;line-height:2.1;margin:8px 0}
h2{font-size:19px;margin:6px 0 10px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap}.flex>*{flex:1}
.mu{color:var(--mu);font-size:14px}
.ex{display:flex;align-items:flex-start;gap:8px}.ex>div{flex:1}
.spk{background:var(--soft);color:var(--pk);border:0;border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;vertical-align:middle;padding:0}
.spk svg{width:18px;height:18px;fill:currentColor}
button.kv{border:0;color:var(--tx);font:inherit;font-size:15px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:#2b2b3a;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;text-align:center}
main,#sh{zoom:var(--z,1)}
html.nofuri rt{display:none}
#mn{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.5);display:none;justify-content:flex-end}
#mn.on{display:flex}
#mp{background:var(--c);width:min(88%,380px);height:100%;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#mp h3{font-size:12px;color:var(--mu);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.mh{display:flex;align-items:center;justify-content:space-between}.mh b{font-size:20px}.mh .x{background:none;border:0;color:var(--tx);font-size:22px;padding:6px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--c);color:var(--tx);border-radius:10px;font-size:14px}
.seg button.on{background:var(--pk);color:#fff;border-color:var(--pk)}
textarea{width:100%;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);padding:10px;font:13px/1.4 ui-monospace,monospace;margin-bottom:8px}
.cp{font-size:13px;line-height:1.65}.cp p{margin:0 0 6px}
.hs{margin-left:auto;color:var(--or);font-style:normal}.hs+.ok{margin-left:6px}
.btn.alt.on{background:var(--or);color:#fff;border-color:var(--or)}
.btn small{display:block;font-weight:400;font-size:11px;opacity:.9}
.tile.hd{border:2px solid var(--or)}
.fc h2{margin:8px 0}
.note{width:100%;font-family:inherit;font-size:14px}
header{border-bottom:3px solid var(--pk)}.lv{background:var(--pk);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px}.hl{background:#fff;border-radius:50%;height:40px;width:40px;margin-right:10px;flex:none}.lgc{background:#fff;border-radius:16px;padding:10px;margin-bottom:12px;border:1px solid var(--bd)}.lg{display:block;width:100%;max-width:320px;margin:0 auto}
#sk{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#sk i{position:absolute;top:-24px;width:var(--s);height:calc(var(--s)*.8);background:linear-gradient(135deg,#ffd6e5,#ff9ebd);border-radius:150% 0 150% 0;opacity:.75;will-change:transform;animation:skf var(--d) linear var(--l) infinite}
@keyframes skf{0%{transform:translate3d(0,-5vh,0) rotate(0)}50%{transform:translate3d(var(--x),55vh,0) rotate(200deg)}100%{transform:translate3d(calc(var(--x)*-.4),112vh,0) rotate(400deg)}}
.nosk #sk{display:none}
@media(prefers-reduced-motion:reduce){#sk{display:none}}
</style></head><body>

/* PENGATURAN LEVEL: untuk membuat level lain, ubah blok CFG ini dan isi data D (bp, bq, kj, kq, th = pembagian tema kanji) di bawahnya. Kode lain tidak perlu disentuh. */
const CFG={level:'N2',key:'pbj:v1',theme:'pbj:theme',version:'1.0',author:'Bobby Abdurrahman Haris',year:2026,title:'日本語の扉'};
const D={"bp":[{"g":"Keharusan & Kemampuan","items":[{"t":"～わけにはいかない","r":"V (bentuk kamus / ない) + わけにはいかない","m":"Tidak bisa melakukan sesuatu karena ada alasan, tanggung jawab, atau pertimbangan moral. Bukan soal kemampuan.","ex":[["明日(あした)は試験(しけん)なので、今夜(こんや)は遊(あそ)ぶわけにはいかない。","Besok ada ujian, jadi malam ini tidak bisa main."],["大事(だいじ)な約束(やくそく)だから、忘(わす)れるわけにはいかない。","Ini janji penting, jadi tidak boleh sampai lupa."]],"n":"Jangan tertukar dengan ～わけがない (tidak mungkin)."},{"t":"～ざるを得ない","r":"V bentuk ない tanpa ない + ざるを得ない (する → せざるを得ない)","m":"Terpaksa; tidak ada pilihan lain selain melakukan hal itu.","ex":[["上司(じょうし)に頼(たの)まれたら、引(ひ)き受(う)けざるを得(え)ない。","Kalau diminta atasan, terpaksa diterima."],["雨(あめ)がひどいので、旅行(りょこう)は中止(ちゅうし)せざるを得(え)ない。","Hujannya parah, jadi perjalanan terpaksa dibatalkan."]],"n":"Nuansanya “terpaksa” dan agak formal, lebih kaku daripada ～しかない."},{"t":"～ずにはいられない","r":"V bentuk ない tanpa ない + ずにはいられない (する → せずにはいられない)","m":"Tidak bisa tidak melakukan; dorongan spontan yang tak tertahankan.","ex":[["悲(かな)しい映画(えいが)を見(み)て、泣(な)かずにはいられなかった。","Menonton film sedih, saya tak bisa menahan tangis."],["彼(かれ)の冗談(じょうだん)を聞(き)くと、笑(わら)わずにはいられない。","Mendengar leluconnya, saya tak bisa tidak tertawa."]],"n":"Berbeda dengan ～ざるを得ない (terpaksa karena keadaan). Ini dorongan perasaan."},{"t":"～べきだ","r":"V bentuk kamus + べきだ (する → するべき / すべき)","m":"Seharusnya. Dipakai untuk nasihat atau kewajiban moral.","ex":[["約束(やくそく)は守(まも)るべきだ。","Janji seharusnya ditepati."],["人(ひと)の悪口(わるぐち)は言(い)うべきではない。","Tidak seharusnya menjelek-jelekkan orang."]],"n":"Bentuk negatifnya ～べきではない (tidak seharusnya)."},{"t":"～ようがない","r":"V bentuk ます (tanpa ます) + ようがない (する → しようがない)","m":"Tidak ada cara untuk melakukan sesuatu.","ex":[["連絡先(れんらくさき)が分(わ)からないので、連絡(れんらく)のしようがない。","Karena tidak tahu kontaknya, tidak ada cara menghubunginya."],["壊(こわ)れてしまって、直(なお)しようがない。","Sudah rusak, tidak ada cara memperbaikinya."]],"n":"Tidak mungkin karena situasi, bukan karena menolak dengan sopan (itu ～かねる)."},{"t":"～てならない","r":"V て / Adj-i くて / Adj-na で + ならない","m":"Perasaan yang tidak tertahankan, sangat ...","ex":[["将来(しょうらい)のことが心配(しんぱい)でならない。","Saya sangat mengkhawatirkan masa depan."],["彼(かれ)のことが気(き)になってならない。","Saya tidak bisa berhenti memikirkan dia."]],"n":"Dipakai untuk perasaan atau sensasi diri sendiri, seperti 心配, 気になる, 嬉しい."},{"t":"～かねる","r":"V bentuk ます (tanpa ます) + かねる","m":"Sulit / tidak bisa (melakukan sesuatu) menurut pertimbangan. Dipakai untuk menolak dengan sopan.","ex":[["そのご質問(しつもん)にはお答(こた)えしかねます。","Mohon maaf, pertanyaan itu tidak bisa kami jawab."],["申(もう)し訳(わけ)ありませんが、その案(あん)には賛成(さんせい)しかねます。","Mohon maaf, saya sulit menyetujui usulan itu."]],"n":"Bukan soal kemampuan. Sering dipakai dalam bahasa bisnis dan layanan."},{"t":"～かねない","r":"V bentuk ます (tanpa ます) + かねない","m":"Bisa-bisa ... (kemungkinan terjadi hal yang buruk).","ex":[["寝不足(ねぶそく)のまま運転(うんてん)すると、事故(じこ)を起(お)こしかねない。","Kalau menyetir dalam keadaan kurang tidur, bisa-bisa menyebabkan kecelakaan."],["そんな言(い)い方(かた)をすると、誤解(ごかい)されかねない。","Kalau bicara seperti itu, bisa-bisa disalahpahami."]],"n":"Pasangan dari ～かねる, tetapi artinya bukan kebalikan sederhana. Hanya untuk hal buruk."}]},{"g":"Dugaan & Penilaian","items":[{"t":"～に違(ちが)いない","r":"V / Adj-i bentuk biasa; Adj-na dan Nomina tanpa だ + に違いない","m":"Pasti, tidak salah lagi. Dugaan kuat pembicara berdasarkan alasan tertentu.","ex":[["電気(でんき)がついているから、彼(かれ)はまだ会社(かいしゃ)にいるに違(ちが)いない。","Lampunya menyala, jadi dia pasti masih di kantor."],["この味(あじ)は、きっと彼女(かのじょ)が作(つく)ったに違(ちが)いない。","Rasa ini pasti dia yang membuatnya."]],"n":"Lebih kuat daripada ～だろう. Tidak dipakai untuk hal yang sudah jelas diketahui."},{"t":"～に決(き)まっている","r":"Bentuk biasa (Adj-na dan Nomina tanpa だ) + に決まっている","m":"Sudah pasti. Keyakinan kuat pembicara.","ex":[["毎日(まいにち)遊(あそ)んでいたら、試験(しけん)に落(お)ちるに決(き)まっている。","Kalau tiap hari main, sudah pasti tidak lulus ujian."],["そんなうまい話(はなし)は、うそに決(き)まっている。","Tawaran seenak itu sudah pasti bohong."]],"n":"Lebih kuat dan lebih subjektif daripada ～に違いない. Banyak dipakai dalam percakapan."},{"t":"～らしい","r":"Bentuk biasa (Adj-na dan Nomina tanpa だ) + らしい","m":"Katanya, tampaknya (berdasarkan informasi yang didengar atau dilihat).","ex":[["彼(かれ)は来月(らいげつ)結婚(けっこん)するらしい。","Katanya dia akan menikah bulan depan."],["この店(みせ)はおいしいらしい。","Katanya toko ini enak."]],"n":"Nomina + らしい juga berarti “khas, pantas” (男らしい), artinya berbeda."},{"t":"～はずだ","r":"Bentuk biasa (Adj-na: ～な, Nomina: ～の) + はずだ","m":"Seharusnya, pasti. Dugaan yang punya dasar logis.","ex":[["彼(かれ)は昨日(きのう)出発(しゅっぱつ)したから、もう着(つ)いているはずだ。","Dia berangkat kemarin, jadi seharusnya sudah tiba."],["この道(みち)を行(い)けば、駅(えき)に出(で)るはずだ。","Kalau lewat jalan ini, seharusnya sampai di stasiun."]],"n":"Bentuk negatif ～はずがない berarti “tidak mungkin”."},{"t":"～おそれがある","r":"V bentuk kamus / Nomina + の + おそれがある","m":"Dikhawatirkan akan terjadi (kemungkinan hal buruk).","ex":[["台風(たいふう)で、電車(でんしゃ)が止(と)まるおそれがある。","Karena topan, dikhawatirkan kereta akan berhenti."],["この薬(くすり)は副作用(ふくさよう)が出(で)るおそれがある。","Obat ini berisiko menimbulkan efek samping."]],"n":"Formal, sering di berita dan pengumuman. Hanya untuk hal buruk."},{"t":"～というより","r":"Bentuk biasa (Adj-na / Nomina tanpa だ) + というより","m":"Daripada disebut A, lebih tepat disebut B.","ex":[["彼(かれ)は優(やさ)しいというより、気(き)が弱(よわ)いのだ。","Daripada disebut baik hati, dia lebih tepatnya lemah hati."],["今日(きょう)は暑(あつ)いというより、蒸(む)し暑(あつ)い。","Hari ini lebih tepat disebut gerah daripada sekadar panas."]],"n":"Sering dipakai untuk meralat penilaian dengan ungkapan yang lebih pas."},{"t":"～ことから","r":"Bentuk biasa (Adj-na: ～な / ～である) + ことから","m":"Dari fakta bahwa ... (dasar penilaian), atau asal-usul sebuah nama.","ex":[["道(みち)が濡(ぬ)れていることから、夜(よる)に雨(あめ)が降(ふ)ったと分(わ)かる。","Dari jalan yang basah, diketahui semalam hujan turun."],["この町(まち)は桜(さくら)が多(おお)いことから、「桜町(さくらまち)」と呼(よ)ばれている。","Kota ini disebut “Sakuramachi” karena banyak sakura."]],"n":"Cocok untuk menjelaskan alasan penilaian atau asal nama."},{"t":"～わけではない","r":"Bentuk biasa (Adj-na: ～な, Nomina: ～という / ～の) + わけではない","m":"Bukan berarti ... (menyangkal sebagian atau kesimpulan yang keliru).","ex":[["毎日(まいにち)走(はし)っているが、好(す)きなわけではない。","Setiap hari lari, tapi bukan berarti suka."],["高(たか)いからといって、品質(ひんしつ)がいいわけではない。","Mahal bukan berarti kualitasnya bagus."]],"n":"Sering berpasangan dengan ～からといって."}]},{"g":"Kontras & Tambahan","items":[{"t":"～ものの","r":"Bentuk biasa (Adj-na: ～な / ～である, Nomina: ～である) + ものの","m":"Memang ..., tetapi ... Kenyataan tidak berjalan sesuai harapan.","ex":[["車(くるま)の免許(めんきょ)は取(と)ったものの、まだ一度(いちど)も運転(うんてん)していない。","SIM-nya sudah dapat, tetapi belum pernah menyetir sekali pun."],["春(はる)になったものの、朝晩(あさばん)はまだ寒(さむ)い。","Memang sudah musim semi, tetapi pagi dan malam masih dingin."]],"n":"Bagian belakang biasanya berisi hal yang tidak sesuai atau tidak berjalan lancar."},{"t":"～くせに","r":"Bentuk biasa (Adj-na: ～な, Nomina: ～の) + くせに","m":"Padahal ... Dipakai untuk mengungkapkan celaan atau rasa tidak puas.","ex":[["知(し)っているくせに、教(おし)えてくれない。","Padahal tahu, tapi tidak mau memberi tahu."],["子供(こども)のくせに、大人(おとな)みたいな話(はな)し方(かた)をする。","Padahal masih anak-anak, cara bicaranya seperti orang dewasa."]],"n":"Bernuansa negatif. Tidak sopan dipakai untuk orang yang dihormati."},{"t":"～どころか","r":"Bentuk biasa (Adj-na: ～な, Nomina: ～) + どころか","m":"Jangankan ..., malah ... (kenyataannya jauh dari itu atau justru sebaliknya).","ex":[["最近(さいきん)は忙(いそが)しくて、旅行(りょこう)どころか、友達(ともだち)に会(あ)う時間(じかん)もない。","Akhir-akhir ini sibuk, jangankan jalan-jalan, waktu bertemu teman pun tidak ada."],["彼(かれ)は謝(あやま)るどころか、逆(ぎゃく)に怒(おこ)り出(だ)した。","Jangankan minta maaf, dia malah balik marah."]],"n":"Bagian belakang sering memakai も / さえ / むしろ / 逆に."},{"t":"～にもかかわらず","r":"Nomina / Bentuk biasa (Adj-na: ～な / ～である) + にもかかわらず","m":"Meskipun ..., tetap ... Hasilnya tidak sesuai dugaan.","ex":[["雨(あめ)にもかかわらず、多(おお)くの人(ひと)が集(あつ)まった。","Meskipun hujan, banyak orang berkumpul."],["忙(いそが)しいにもかかわらず、手伝(てつだ)ってくれた。","Meskipun sibuk, dia tetap membantu."]],"n":"Formal. Cocok untuk tulisan dan pidato."},{"t":"～ながらも","r":"V bentuk ます / Adj-i / Adj-na / Nomina + ながらも","m":"Walaupun, sekalipun (dua hal yang bertentangan).","ex":[["小(ちい)さいながらも、立派(りっぱ)な家(いえ)だ。","Walaupun kecil, rumah ini megah."],["彼(かれ)は貧(まず)しいながらも、明(あか)るく生(い)きている。","Walaupun miskin, dia hidup dengan ceria."]],"n":"Subjek kedua klausa sama. Bernuansa tulisan."},{"t":"～ばかりか","r":"Bentuk biasa (Adj-na: ～な / ～である, Nomina: ～である / ～の) + ばかりか","m":"Tidak hanya ..., bahkan juga ...","ex":[["彼(かれ)は英語(えいご)ばかりか、中国語(ちゅうごくご)も話(はな)せる。","Dia tidak hanya bisa bahasa Inggris, bahasa Mandarin pun bisa."],["雨(あめ)が降(ふ)ってきたばかりか、風(かぜ)まで強(つよ)くなってきた。","Tidak hanya hujan mulai turun, angin pun jadi kencang."]],"n":"Bagian belakang biasanya memakai も / まで / さえ."},{"t":"～はもちろん","r":"Nomina + はもちろん、…も","m":"Apalagi, tentu saja ... bahkan ... juga.","ex":[["彼女(かのじょ)は英語(えいご)はもちろん、フランス語(ご)も話(はな)せる。","Bahasa Inggris tentu saja, bahasa Prancis pun dia bisa."],["この町(まち)は夏(なつ)はもちろん、冬(ふゆ)も観光客(かんこうきゃく)が多(おお)い。","Di kota ini, musim panas tentu ramai, musim dingin pun banyak wisatawan."]],"n":"Hal pertama dianggap sudah jelas, hal kedua ditambahkan dengan も."},{"t":"～一方(いっぽう)で","r":"Bentuk biasa (Adj-na: ～な / ～である) + 一方で","m":"Di satu sisi ..., di sisi lain ...","ex":[["この仕事(しごと)は大変(たいへん)な一方(いっぽう)で、やりがいもある。","Pekerjaan ini berat, tetapi di sisi lain memuaskan."],["都市(とし)は便利(べんり)な一方(いっぽう)で、物価(ぶっか)が高(たか)い。","Kota itu praktis, tetapi di sisi lain harga-harganya mahal."]],"n":"Membandingkan dua sisi dari satu hal."}]},{"g":"Waktu & Perubahan","items":[{"t":"～最中(さいちゅう)に","r":"V ている / Nomina + の + 最中に","m":"Tepat di tengah-tengah suatu kejadian, lalu terjadi hal lain.","ex":[["会議(かいぎ)の最中(さいちゅう)に、電話(でんわ)が鳴(な)った。","Di tengah rapat, telepon berdering."],["食事(しょくじ)をしている最中(さいちゅう)に、地震(じしん)が起(お)きた。","Saat sedang makan, gempa terjadi."]],"n":"Bagian belakang biasanya kejadian mendadak."},{"t":"～うちに","r":"V kamus / V ている / V ない / Adj + うちに (Nomina: ～のうちに)","m":"Selagi masih ... (sebelum keadaan berubah).","ex":[["若(わか)いうちに、いろいろな経験(けいけん)をしたい。","Selagi muda, saya ingin mengalami banyak hal."],["忘(わす)れないうちに、メモしておく。","Saya catat dulu sebelum lupa."]],"n":"Juga dipakai untuk perubahan yang terjadi tanpa disadari (読んでいるうちに)."},{"t":"～たとたん","r":"V bentuk た + とたん(に)","m":"Begitu ..., langsung ... (kejadian tak terduga).","ex":[["家(いえ)を出(で)たとたん、雨(あめ)が降(ふ)り出(だ)した。","Begitu keluar rumah, hujan langsung turun."],["立(た)ち上(あ)がったとたん、めまいがした。","Begitu berdiri, kepala langsung pusing."]],"n":"Tidak dipakai untuk tindakan sengaja pembicara, perintah, atau ajakan."},{"t":"～次第(しだい)","r":"V bentuk ます (tanpa ます) / Nomina + 次第","m":"Begitu ... (segera setelah itu selesai, lakukan hal berikutnya).","ex":[["準備(じゅんび)ができ次第(しだい)、出発(しゅっぱつ)します。","Begitu persiapan selesai, kami berangkat."],["結果(けっか)が分(わ)かり次第(しだい)、連絡(れんらく)します。","Begitu hasilnya diketahui, saya akan menghubungi."]],"n":"Bagian belakang berupa tindakan sengaja di masa depan. Formal."},{"t":"～つつある","r":"V bentuk ます (tanpa ます) + つつある","m":"Sedang terus berubah ke arah tertentu.","ex":[["日本(にほん)の人口(じんこう)は減(へ)りつつある。","Penduduk Jepang sedang terus berkurang."],["景気(けいき)は回復(かいふく)しつつある。","Perekonomian sedang pulih."]],"n":"Untuk perubahan bertahap. Banyak dipakai dalam berita dan tulisan formal."},{"t":"～に際(さい)して","r":"V bentuk kamus / Nomina + に際して","m":"Pada saat akan melakukan sesuatu yang penting. Gaya formal.","ex":[["入学(にゅうがく)に際(さい)して、必要(ひつよう)な書類(しょるい)を提出(ていしゅつ)してください。","Saat masuk sekolah, harap kumpulkan dokumen yang diperlukan."],["契約(けいやく)に際(さい)しては、内容(ないよう)をよく確認(かくにん)する必要(ひつよう)がある。","Saat membuat kontrak, isinya perlu dicek dengan teliti."]],"n":"Dipakai untuk momen penting, biasanya dalam tulisan atau pidato resmi."},{"t":"～をきっかけに","r":"Nomina / V bentuk kamus + のをきっかけに","m":"Berawal dari, dipicu oleh. Suatu kejadian menjadi awal perubahan atau tindakan baru.","ex":[["留学(りゅうがく)をきっかけに、日本(にほん)の文化(ぶんか)に興味(きょうみ)を持(も)つようになった。","Berawal dari belajar di luar negeri, saya jadi tertarik dengan budaya Jepang."],["友達(ともだち)に誘(さそ)われたのをきっかけに、ジョギングを始(はじ)めた。","Berawal dari diajak teman, saya mulai jogging."]],"n":"Variasi: ～をきっかけとして / ～がきっかけで."},{"t":"～に伴(ともな)って","r":"Nomina / V bentuk kamus + に伴って","m":"Seiring dengan ... (dua perubahan terjadi bersamaan).","ex":[["人口(じんこう)の増加(ぞうか)に伴(ともな)って、交通量(こうつうりょう)も増(ふ)えた。","Seiring bertambahnya penduduk, volume lalu lintas juga naik."],["技術(ぎじゅつ)の進歩(しんぽ)に伴(ともな)って、生活(せいかつ)が便利(べんり)になった。","Seiring kemajuan teknologi, hidup jadi lebih praktis."]],"n":"Kedua sisi sama-sama berubah. Mirip dengan ～につれて."}]},{"g":"Topik & Sudut Pandang","items":[{"t":"～に対(たい)して","r":"Nomina + に対して","m":"Terhadap (objek sikap atau tindakan). Juga dipakai untuk membandingkan dua hal yang berlawanan (sedangkan).","ex":[["先生(せんせい)は学生(がくせい)に対(たい)して、とても親切(しんせつ)だ。","Terhadap murid-muridnya, guru sangat ramah."],["兄(あに)は明(あか)るいのに対(たい)して、弟(おとうと)は静(しず)かだ。","Kakak ceria, sedangkan adik pendiam."]],"n":"Pola ～のに対して dipakai untuk kontras, sedangkan ～に対して untuk objek sikap."},{"t":"～に関(かん)して","r":"Nomina + に関して","m":"Mengenai, berkaitan dengan. Lebih formal daripada ～について.","ex":[["事故(じこ)の原因(げんいん)に関(かん)して、調査(ちょうさ)が行(おこな)われている。","Mengenai penyebab kecelakaan, sedang dilakukan penyelidikan."],["日本(にほん)の歴史(れきし)に関(かん)して、レポートを書(か)く。","Saya menulis laporan mengenai sejarah Jepang."]],"n":"Bentuk penjelas nomina: ～に関する + Nomina."},{"t":"～によって","r":"Nomina + によって","m":"Tergantung pada; oleh (pelaku dalam kalimat pasif); dengan cara/sarana.","ex":[["国(くに)によって、習慣(しゅうかん)が違(ちが)う。","Tergantung negaranya, kebiasaannya berbeda."],["この絵(え)は有名(ゆうめい)な画家(がか)によって描(えが)かれた。","Lukisan ini dilukis oleh pelukis terkenal."]],"n":"Punya beberapa fungsi, jadi lihat konteks kalimatnya."},{"t":"～において","r":"Nomina + において","m":"Di (tempat), pada (waktu atau bidang). Formal, seperti で tetapi lebih kaku.","ex":[["会議(かいぎ)は第一会議室(だいいちかいぎしつ)において行(おこな)われる。","Rapat diadakan di ruang rapat pertama."],["現代社会(げんだいしゃかい)において、インターネットは欠(か)かせない。","Dalam masyarakat modern, internet tidak tergantikan."]],"n":"Bentuk penjelas nomina: ～における + Nomina."},{"t":"～を通(つう)じて","r":"Nomina + を通じて / を通して","m":"Melalui (perantara atau sarana); sepanjang (periode waktu).","ex":[["友達(ともだち)を通(つう)じて、彼(かれ)と知(し)り合(あ)った。","Saya berkenalan dengannya melalui teman."],["この地域(ちいき)は一年(いちねん)を通(つう)じて温暖(おんだん)だ。","Daerah ini hangat sepanjang tahun."]],"n":"Untuk arti “melalui sarana”, ～を通して juga sering dipakai."},{"t":"～にとって","r":"Nomina (orang / organisasi) + にとって","m":"Bagi, dari sudut pandang. Diikuti penilaian atau perasaan.","ex":[["私(わたし)にとって、家族(かぞく)は何(なに)よりも大切(たいせつ)だ。","Bagiku, keluarga lebih penting daripada apa pun."],["新人(しんじん)にとって、この仕事(しごと)は難(むずか)しい。","Bagi pegawai baru, pekerjaan ini sulit."]],"n":"Tidak dipakai dengan kalimat perintah, ajakan, atau permintaan."},{"t":"～を中心(ちゅうしん)に","r":"Nomina + を中心に (して)","m":"Berpusat pada, dengan ... sebagai pusat.","ex":[["駅(えき)を中心(ちゅうしん)に、店(みせ)が集(あつ)まっている。","Toko-toko berkumpul di sekitar stasiun."],["関東地方(かんとうちほう)を中心(ちゅうしん)に、大雨(おおあめ)が降(ふ)った。","Hujan deras turun, terutama di wilayah Kanto."]],"n":"Variasi: ～を中心として / ～を中心とした + Nomina."},{"t":"～に限(かぎ)らず","r":"Nomina + に限らず","m":"Tidak terbatas pada ... (yang lain juga).","ex":[["この店(みせ)は、休日(きゅうじつ)に限(かぎ)らず、平日(へいじつ)も混(こ)んでいる。","Toko ini ramai tidak hanya di hari libur, hari kerja pun."],["若者(わかもの)に限(かぎ)らず、お年寄(としよ)りにも人気(にんき)がある。","Bukan hanya anak muda, orang tua pun menyukainya."]],"n":"Sering diikuti も."}]},{"g":"Syarat & Pengandaian","items":[{"t":"～さえ～ば","r":"Nomina + さえ + V ば / Adj ければ (V ます形 + さえすれば)","m":"Asalkan ..., cukup ... saja pasti.","ex":[["時間(じかん)さえあれば、旅行(りょこう)に行(い)きたい。","Asalkan ada waktu, saya ingin pergi berlibur."],["薬(くすり)を飲(の)みさえすれば、すぐ治(なお)る。","Asalkan minum obat saja, pasti cepat sembuh."]],"n":"Menekankan bahwa satu syarat itu sudah cukup."},{"t":"～ば～ほど","r":"V ば + V kamus + ほど / Adj-i ければ + Adj-i + ほど","m":"Semakin ..., semakin ...","ex":[["勉強(べんきょう)すればするほど、おもしろくなる。","Semakin dipelajari, semakin menarik."],["安(やす)ければ安(やす)いほどいい。","Semakin murah semakin baik."]],"n":"Adj-na: 静(しず)かなら静(しず)かなほど."},{"t":"～としたら","r":"Bentuk biasa + としたら / とすれば","m":"Seandainya, kalau saja (pengandaian).","ex":[["もし一億円(いちおくえん)当(あ)たったとしたら、家(いえ)を買(か)う。","Seandainya menang seratus juta yen, saya akan beli rumah."],["行(い)くとしたら、来月(らいげつ)がいい。","Kalau mau pergi, bulan depan bagus."]],"n":"Bagian belakang berupa pendapat atau rencana, bukan fakta pasti."},{"t":"～ない限(かぎ)り","r":"V bentuk ない + 限り (Nomina: ～でない限り)","m":"Selama tidak ..., kecuali kalau ...","ex":[["努力(どりょく)しない限(かぎ)り、成功(せいこう)しない。","Selama tidak berusaha, tidak akan berhasil."],["病気(びょうき)が治(なお)らない限(かぎ)り、退院(たいいん)できない。","Selama penyakitnya belum sembuh, tidak bisa keluar rumah sakit."]],"n":"Bagian belakang biasanya hasil negatif."},{"t":"～ものなら","r":"V bentuk potensial (kamus) + ものなら","m":"Kalau saja bisa ... (hal yang sulit dilakukan).","ex":[["できるものなら、もう一度(いちど)やり直(なお)したい。","Kalau bisa, saya ingin mengulang sekali lagi."],["行(い)けるものなら、行(い)きたいが、時間(じかん)がない。","Kalau bisa pergi, saya mau, tetapi tidak ada waktu."]],"n":"Dipakai untuk hal yang hampir mustahil."},{"t":"～からには","r":"Bentuk biasa (Adj-na: ～である) + からには","m":"Karena sudah ..., maka harus ...","ex":[["引(ひ)き受(う)けたからには、最後(さいご)までやる。","Karena sudah menerima, saya akan kerjakan sampai akhir."],["日本(にほん)に来(き)たからには、日本語(にほんご)を上手(じょうず)になりたい。","Karena sudah datang ke Jepang, saya ingin mahir bahasa Jepang."]],"n":"Bagian belakang berupa tekad, kewajiban, atau saran."},{"t":"～次第(しだい)で","r":"Nomina + 次第で / 次第では","m":"Tergantung pada ...","ex":[["結果(けっか)次第(しだい)では、計画(けいかく)を変(か)える。","Tergantung hasilnya, rencana akan diubah."],["天気(てんき)次第(しだい)で、中止(ちゅうし)になる。","Tergantung cuaca, bisa dibatalkan."]],"n":"Jangan tertukar dengan ～次第 (begitu ...), fungsinya berbeda."},{"t":"～ないことには","r":"V bentuk ない + ことには","m":"Kalau tidak ..., tidak bisa ...","ex":[["実際(じっさい)に見(み)ないことには、何(なに)とも言(い)えない。","Kalau tidak melihat langsung, tidak bisa berkomentar apa pun."],["練習(れんしゅう)しないことには、上手(じょうず)にならない。","Kalau tidak berlatih, tidak akan mahir."]],"n":"Bagian belakang bernada negatif."}]},{"g":"Alasan, Tujuan & Hasil","items":[{"t":"～ものだから","r":"Bentuk biasa (Adj-na dan Nomina: ～な) + ものだから","m":"Karena (alasan yang disampaikan sebagai pembelaan).","ex":[["急(いそ)いでいたものだから、財布(さいふ)を忘(わす)れた。","Karena terburu-buru, dompetnya tertinggal."],["道(みち)が混(こ)んでいたものですから、遅(おく)れてしまいました。","Karena jalan macet, saya jadi terlambat."]],"n":"Dipakai untuk alasan atau pembelaan diri, tidak untuk perintah."},{"t":"～あまり","r":"V kamus / Nomina + の + あまり","m":"Saking ... sampai ...","ex":[["嬉(うれ)しさのあまり、泣(な)き出(だ)した。","Saking senangnya, dia menangis."],["忙(いそが)しさのあまり、体(からだ)を壊(こわ)した。","Saking sibuknya, tubuhnya jatuh sakit."]],"n":"Hasilnya berupa tindakan atau kondisi yang berlebihan."},{"t":"～からこそ","r":"Bentuk biasa + からこそ","m":"Justru karena ...","ex":[["苦労(くろう)したからこそ、成功(せいこう)の喜(よろこ)びが大(おお)きい。","Justru karena sudah susah payah, kegembiraan suksesnya besar."],["好(す)きだからこそ、厳(きび)しく言(い)うのだ。","Justru karena sayang, saya berkata dengan tegas."]],"n":"Menekankan bahwa itulah alasan sebenarnya."},{"t":"～ばかりに","r":"Bentuk biasa (Adj-na: ～な, Nomina: ～である) + ばかりに","m":"Hanya gara-gara ... (akibat buruk).","ex":[["英語(えいご)ができないばかりに、チャンスを逃(のが)した。","Hanya karena tidak bisa bahasa Inggris, saya kehilangan kesempatan."],["うそをついたばかりに、信用(しんよう)を失(うしな)った。","Hanya karena berbohong, dia kehilangan kepercayaan."]],"n":"Bagian belakang selalu hasil yang buruk."},{"t":"～べく","r":"V kamus + べく (する → すべく)","m":"Untuk, dengan maksud ... (tujuan).","ex":[["試験(しけん)に合格(ごうかく)するべく、毎日(まいにち)勉強(べんきょう)している。","Demi lulus ujian, dia belajar setiap hari."],["結婚資金(けっこんしきん)を貯(た)めるべく、アルバイトを始(はじ)めた。","Untuk mengumpulkan dana pernikahan, dia mulai kerja paruh waktu."]],"n":"Gaya tulisan formal."},{"t":"～ことなく","r":"V kamus + ことなく","m":"Tanpa melakukan ...","ex":[["彼(かれ)は一度(いちど)も休(やす)むことなく、働(はたら)き続(つづ)けた。","Dia terus bekerja tanpa sekali pun beristirahat."],["誰(だれ)にも知(し)られることなく、町(まち)を出(で)た。","Dia meninggalkan kota tanpa diketahui siapa pun."]],"n":"Mirip ～ないで / ～ずに tetapi lebih formal."},{"t":"～ずに済(す)む","r":"V bentuk ない tanpa ない + ずに済む (ないで済む)","m":"Bisa terhindar dari ..., tidak perlu ...","ex":[["傘(かさ)を持(も)っていたので、濡(ぬ)れずに済(す)んだ。","Karena bawa payung, saya tidak kebasahan."],["早(はや)めに謝(あやま)ったので、怒(おこ)られずに済(す)んだ。","Karena segera minta maaf, saya tidak dimarahi."]],"n":"Menyatakan hal buruk yang akhirnya tidak terjadi."},{"t":"～ゆえに","r":"Nomina + ゆえに / Bentuk biasa + がゆえに","m":"Karena (sangat formal, tulisan).","ex":[["貧(まず)しさゆえに、学校(がっこう)に行(い)けなかった。","Karena kemiskinan, dia tidak bisa bersekolah."],["若(わか)さゆえに、失敗(しっぱい)することもある。","Karena masih muda, kadang gagal."]],"n":"Sangat formal dan bernuansa sastra."}]},{"g":"Perbandingan & Tingkat","items":[{"t":"～に比(くら)べて","r":"Nomina + に比べて / と比べて","m":"Dibandingkan dengan ...","ex":[["去年(きょねん)に比(くら)べて、今年(ことし)は暑(あつ)い。","Dibandingkan tahun lalu, tahun ini panas."],["都会(とかい)に比(くら)べて、田舎(いなか)は空気(くうき)がきれいだ。","Dibandingkan kota besar, udara desa lebih bersih."]],"n":"Bentuk lain: ～に比べると."},{"t":"～に反(はん)して","r":"Nomina + に反して","m":"Bertentangan dengan (harapan, dugaan).","ex":[["予想(よそう)に反(はん)して、試合(しあい)は一方的(いっぽうてき)だった。","Di luar dugaan, pertandingan berlangsung sepihak."],["期待(きたい)に反(はん)して、結果(けっか)は悪(わる)かった。","Bertentangan dengan harapan, hasilnya buruk."]],"n":"Nomina yang umum: 予想, 期待, 規則."},{"t":"～に応(おう)じて","r":"Nomina + に応じて","m":"Sesuai dengan, menyesuaikan.","ex":[["収入(しゅうにゅう)に応(おう)じて、税金(ぜいきん)を払(はら)う。","Membayar pajak sesuai penghasilan."],["季節(きせつ)に応(おう)じて、服(ふく)を変(か)える。","Mengganti pakaian sesuai musim."]],"n":"Hal yang disesuaikan berubah mengikuti keadaan."},{"t":"～につれて","r":"V kamus / Nomina + につれて","m":"Seiring dengan (perubahan bertahap).","ex":[["時間(じかん)がたつにつれて、悲(かな)しみが薄(うす)れた。","Seiring waktu, kesedihan memudar."],["年(とし)をとるにつれて、体力(たいりょく)が落(お)ちる。","Seiring bertambah usia, stamina menurun."]],"n":"Bagian belakang tidak berupa kemauan atau perintah."},{"t":"～にしては","r":"Bentuk biasa (Nomina dan Adj-na tanpa だ) + にしては","m":"Untuk ukuran ..., (ternyata) ...","ex":[["彼(かれ)は子供(こども)にしては、しっかりしている。","Untuk ukuran anak-anak, dia sangat dewasa."],["初(はじ)めてにしては、よくできている。","Untuk ukuran pertama kali, hasilnya bagus."]],"n":"Hasilnya berbeda dari yang biasa diharapkan dari standar itu."},{"t":"～わりに(は)","r":"Bentuk biasa (Adj-na: ～な, Nomina: ～の) + わりに(は)","m":"Dibandingkan dengan ... (kenyataannya tidak sebanding).","ex":[["値段(ねだん)のわりに、味(あじ)がいい。","Dibandingkan harganya, rasanya enak."],["勉強(べんきょう)しなかったわりには、点(てん)がよかった。","Padahal tidak belajar, nilainya bagus."]],"n":"Mirip ～にしては, tetapi lebih fleksibel."},{"t":"～だけあって","r":"Bentuk biasa (Adj-na: ～な, Nomina) + だけあって","m":"Pantas, sesuai dengan reputasi atau statusnya.","ex":[["彼(かれ)はプロだけあって、写真(しゃしん)がうまい。","Pantas saja, dia profesional, fotonya bagus."],["有名(ゆうめい)な店(みせ)だけあって、いつも混(こ)んでいる。","Sesuai reputasinya sebagai toko terkenal, selalu ramai."]],"n":"Pujian atas hasil yang sepadan dengan kemampuan atau status."},{"t":"～ほど","r":"Bentuk biasa (Adj-na: ～な, Nomina) + ほど","m":"Sampai ..., sebanyak ... (tingkat atau batas).","ex":[["痛(いた)くて、泣(な)きたいほどだった。","Sakitnya sampai ingin menangis."],["日本語(にほんご)は思(おも)ったほど難(むずか)しくない。","Bahasa Jepang tidak sesulit yang kubayangkan."]],"n":"Pola ～ほど～ない berarti “tidak sebanyak / sesulit”."}]},{"g":"Dasar & Ungkapan Formal","items":[{"t":"～をはじめ","r":"Nomina + をはじめ(として)","m":"Mulai dari ... dan lainnya.","ex":[["東京(とうきょう)をはじめ、全国(ぜんこく)で雪(ゆき)が降(ふ)った。","Mulai dari Tokyo, salju turun di seluruh negeri."],["社長(しゃちょう)をはじめ、社員(しゃいん)全員(ぜんいん)が出席(しゅっせき)した。","Mulai dari direktur, seluruh karyawan hadir."]],"n":"Contoh yang paling menonjol disebut lebih dulu."},{"t":"～にわたって","r":"Nomina (waktu, tempat, jumlah) + にわたって","m":"Sepanjang, mencakup (rentang luas).","ex":[["三日間(みっかかん)にわたって、会議(かいぎ)が行(おこな)われた。","Rapat diadakan selama tiga hari."],["全国(ぜんこく)にわたって、被害(ひがい)が出(で)た。","Kerusakan terjadi di seluruh negeri."]],"n":"Bentuk penjelas nomina: ～にわたる + Nomina."},{"t":"～に限(かぎ)る","r":"Nomina / V kamus / V ない + に限る","m":"Paling baik adalah ...","ex":[["疲(つか)れたときは、温泉(おんせん)に限(かぎ)る。","Kalau sedang lelah, paling enak ke pemandian air panas."],["夏(なつ)はビールに限(かぎ)る。","Kalau musim panas, bir yang paling pas."]],"n":"Pendapat subjektif pembicara, sering dalam percakapan."},{"t":"～に過(す)ぎない","r":"Bentuk biasa (Adj-na: ～である, Nomina) + に過ぎない","m":"Hanya ..., tidak lebih dari ...","ex":[["それは噂(うわさ)に過(す)ぎない。","Itu hanyalah gosip."],["私(わたし)は一社員(いちしゃいん)に過(す)ぎない。","Saya hanyalah seorang karyawan biasa."]],"n":"Menekankan bahwa sesuatu itu sepele."},{"t":"～とは限(かぎ)らない","r":"Bentuk biasa + とは限らない","m":"Belum tentu, tidak selalu.","ex":[["高(たか)いからといって、いいとは限(かぎ)らない。","Meskipun mahal, belum tentu bagus."],["有名(ゆうめい)な人(ひと)が正(ただ)しいとは限(かぎ)らない。","Orang terkenal belum tentu benar."]],"n":"Menyangkal anggapan umum."},{"t":"～ということだ","r":"Bentuk biasa + ということだ","m":"Katanya, kabarnya (kutipan).","ex":[["天気予報(てんきよほう)によると、明日(あした)は雨(あめ)だということだ。","Menurut ramalan cuaca, besok hujan."],["社長(しゃちょう)は出張(しゅっちょう)で、今日(きょう)は戻(もど)らないということです。","Kabarnya direktur dinas luar dan tidak kembali hari ini."]],"n":"Mirip ～そうだ (kabar), tetapi lebih formal."},{"t":"～に基(もと)づいて","r":"Nomina + に基づいて","m":"Berdasarkan ...","ex":[["事実(じじつ)に基(もと)づいて、報告書(ほうこくしょ)を書(か)く。","Menulis laporan berdasarkan fakta."],["調査(ちょうさ)結果(けっか)に基(もと)づいて、計画(けいかく)を立(た)てた。","Menyusun rencana berdasarkan hasil survei."]],"n":"Bentuk penjelas nomina: ～に基づく + Nomina."},{"t":"～をもとに","r":"Nomina + をもとに(して)","m":"Dengan ... sebagai bahan atau dasar.","ex":[["実話(じつわ)をもとに、映画(えいが)が作(つく)られた。","Film dibuat berdasarkan kisah nyata."],["経験(けいけん)をもとに、本(ほん)を書(か)いた。","Saya menulis buku berdasarkan pengalaman."]],"n":"Dasar diolah menjadi sesuatu yang baru. Beda dengan ～に基づいて (patokan)."}]},{"g":"Kecenderungan & Keadaan","items":[{"t":"～がち","r":"V bentuk ます (tanpa ます) / Nomina + がち","m":"Cenderung, sering (hal kurang baik).","ex":[["冬(ふゆ)は風邪(かぜ)をひきがちだ。","Di musim dingin cenderung mudah masuk angin."],["彼女(かのじょ)は遅刻(ちこく)しがちだ。","Dia cenderung sering terlambat."]],"n":"Untuk kecenderungan yang negatif."},{"t":"～っぽい","r":"Nomina / V bentuk ます / Adj (tanpa い) + っぽい","m":"Bersifat seperti, mudah ...","ex":[["彼(かれ)は子供(こども)っぽい。","Dia kekanak-kanakan."],["忘(わす)れっぽくて困(こま)る。","Saya pelupa, jadi repot."]],"n":"Biasanya bernuansa kurang baik. Bahasa lisan."},{"t":"～気味(ぎみ)","r":"V bentuk ます (tanpa ます) / Nomina + 気味","m":"Agak, ada tanda-tanda (kondisi kurang baik).","ex":[["最近(さいきん)、疲(つか)れ気味(ぎみ)だ。","Belakangan ini agak lelah."],["風邪気味(かぜぎみ)なので、早(はや)く寝(ね)る。","Karena agak masuk angin, saya tidur lebih awal."]],"n":"Tingkatnya ringan."},{"t":"～向(む)き・～向(む)け","r":"Nomina + 向き / Nomina + 向け","m":"向き = cocok untuk; 向け = ditujukan untuk.","ex":[["この本(ほん)は子供(こども)向(む)きだ。","Buku ini cocok untuk anak-anak."],["外国人(がいこくじん)向(む)けの日本語(にほんご)の教科書(きょうかしょ)。","Buku teks bahasa Jepang untuk orang asing."]],"n":"向き: sifatnya cocok. 向け: sengaja dibuat untuk target tertentu."},{"t":"～ぶり","r":"Nomina (jangka waktu) + ぶり(に)","m":"Setelah sekian lama.","ex":[["三年(さんねん)ぶりに、故郷(ふるさと)に帰(かえ)った。","Setelah tiga tahun, saya pulang kampung."],["一週間(いっしゅうかん)ぶりに、雨(あめ)がやんだ。","Setelah seminggu, hujan akhirnya berhenti."]],"n":"久(ひさ)しぶり = sudah lama tidak bertemu."},{"t":"～だらけ","r":"Nomina + だらけ","m":"Penuh dengan (hal yang tidak menyenangkan).","ex":[["部屋(へや)がごみだらけだ。","Kamarnya penuh sampah."],["間違(まちが)いだらけのレポート。","Laporan yang penuh kesalahan."]],"n":"Selalu bernuansa negatif."},{"t":"～きる","r":"V bentuk ます (tanpa ます) + きる / きれない","m":"Sampai habis, sepenuhnya; tidak sanggup menghabiskan.","ex":[["全部(ぜんぶ)食(た)べきれなかった。","Saya tidak sanggup menghabiskan semuanya."],["疲(つか)れきって、動(うご)けない。","Saking lelahnya, tidak bisa bergerak."]],"n":"Juga dipakai untuk 信(しん)じきる (percaya sepenuhnya)."},{"t":"～ついでに","r":"V kamus / V た / Nomina + の + ついでに","m":"Sekalian, mumpung.","ex":[["買(か)い物(もの)のついでに、郵便局(ゆうびんきょく)に寄(よ)った。","Sekalian belanja, saya mampir ke kantor pos."],["出(で)かけるついでに、手紙(てがみ)を出(だ)してきてくれる？","Sekalian keluar, bisa tolong kirimkan surat?"]],"n":"Tindakan kedua dilakukan sekalian saat melakukan tindakan utama."}]},{"g":"Sikap & Perasaan Pembicara","items":[{"t":"～てたまらない","r":"V て / Adj-i くて / Adj-na で + たまらない","m":"Sangat ... sampai tak tertahankan.","ex":[["眠(ねむ)くてたまらない。","Mengantuk sekali, tak tertahankan."],["彼(かれ)に会(あ)いたくてたまらない。","Saya rindu sekali ingin bertemu dia."]],"n":"Mirip ～てならない, tetapi lebih lisan dan dekat ke sensasi tubuh."},{"t":"～ものだ","r":"V kamus / Adj-i + ものだ","m":"Memang sewajarnya; betapa ...; dulu sering (～たものだ).","ex":[["年(とし)を取(と)ると、体力(たいりょく)は落(お)ちるものだ。","Kalau bertambah usia, stamina memang menurun."],["学生(がくせい)のころは、よく夜遅(よるおそ)くまで話(はな)したものだ。","Waktu mahasiswa, saya dulu sering mengobrol sampai larut malam."]],"n":"Artinya tergantung konteks: kebenaran umum, kenangan, atau emosi."},{"t":"～ことだ","r":"V kamus / V ない + ことだ","m":"Sebaiknya (nasihat).","ex":[["日本語(にほんご)が上手(じょうず)になりたいなら、毎日(まいにち)話(はな)すことだ。","Kalau ingin mahir bahasa Jepang, sebaiknya bicara setiap hari."],["風邪(かぜ)を引(ひ)かないように、早(はや)く寝(ね)ることだ。","Supaya tidak masuk angin, sebaiknya tidur lebih awal."]],"n":"Dipakai orang yang lebih berpengalaman saat memberi saran."},{"t":"～ものではない","r":"V kamus + ものではない","m":"Tidak sepatutnya, tidak baik.","ex":[["人(ひと)の悪口(わるぐち)を言(い)うものではない。","Tidak baik menjelek-jelekkan orang."],["約束(やくそく)を破(やぶ)るものではない。","Tidak sepatutnya melanggar janji."]],"n":"Nasihat moral yang bersifat umum."},{"t":"～かいがある","r":"V た / Nomina の + かいがある (かいがない)","m":"Sepadan dengan usaha, ada gunanya.","ex":[["毎日(まいにち)練習(れんしゅう)したかいがあって、試合(しあい)に勝(か)てた。","Latihan tiap hari terbayar, saya bisa menang pertandingan."],["苦労(くろう)したかいがあった。","Susah payahnya terbayar."]],"n":"Bentuk negatif ～かいがない berarti sia-sia."},{"t":"～ものか","r":"Bentuk biasa (Adj-na: ～な) + ものか","m":"Sama sekali tidak, mana mungkin (penolakan kuat).","ex":[["あんな店(みせ)、二度(にど)と行(い)くものか。","Toko seperti itu, tidak akan kudatangi lagi!"],["そんなに簡単(かんたん)にできるものか。","Mana mungkin semudah itu!"]],"n":"Bahasa lisan dan emosional."},{"t":"～ことはない","r":"V kamus + ことはない","m":"Tidak perlu ...","ex":[["心配(しんぱい)することはない。","Tidak perlu khawatir."],["急(いそ)ぐことはない、まだ時間(じかん)がある。","Tidak perlu terburu-buru, masih ada waktu."]],"n":"Untuk menenangkan atau menyarankan agar tidak perlu."},{"t":"～ほかない","r":"V kamus + ほかない (しかない)","m":"Tidak ada pilihan lain selain ...","ex":[["約束(やくそく)したので、行(い)くほかない。","Karena sudah berjanji, tidak ada pilihan selain pergi."],["自分(じぶん)でやるほかない。","Tidak ada cara lain selain mengerjakannya sendiri."]],"n":"Mirip ～ざるを得ない, tetapi lebih lisan."}]},{"g":"Cara & Urutan Tindakan","items":[{"t":"～つつ(も)","r":"V bentuk ます (tanpa ます) + つつ(も)","m":"Sambil; meskipun (tahu ...).","ex":[["体(からだ)に悪(わる)いと知(し)りつつ、やめられない。","Walau tahu buruk untuk tubuh, tidak bisa berhenti."],["反省(はんせい)しつつも、また同(おな)じ失敗(しっぱい)をしてしまった。","Walau sudah menyesal, saya mengulang kesalahan yang sama."]],"n":"Dalam tulisan, つつ juga berarti “sambil”, seperti ～ながら."},{"t":"～っぱなし","r":"V bentuk ます (tanpa ます) + っぱなし","m":"Dibiarkan terus dalam keadaan ...","ex":[["ドアを開(あ)けっぱなしにした。","Saya membiarkan pintu terbuka."],["一日中(いちにちじゅう)、立(た)ちっぱなしだった。","Seharian terus berdiri."]],"n":"Bernuansa negatif (kelalaian atau beban)."},{"t":"～かけ","r":"V bentuk ます (tanpa ます) + かけ(の)","m":"Setengah jalan, belum selesai.","ex":[["読(よ)みかけの本(ほん)がある。","Ada buku yang belum selesai kubaca."],["食(た)べかけのパンを置(お)いたまま、出(で)かけた。","Dia pergi meninggalkan roti yang baru dimakan setengah."]],"n":"Tindakan terhenti di tengah jalan."},{"t":"～がたい","r":"V bentuk ます (tanpa ます) + がたい","m":"Sulit untuk ... (karena perasaan atau keadaan).","ex":[["信(しん)じがたい話(はなし)だ。","Itu cerita yang sulit dipercaya."],["忘(わす)れがたい思(おも)い出(で)がある。","Ada kenangan yang sulit dilupakan."]],"n":"Terbatas pada verba tertentu seperti 信じる, 忘れる, 理解する."},{"t":"～づらい","r":"V bentuk ます (tanpa ます) + づらい","m":"Sulit, berat (secara fisik atau perasaan).","ex":[["言(い)いづらいことだが、本当(ほんとう)のことを話(はな)す。","Sulit diucapkan, tetapi saya akan bicara jujur."],["この靴(くつ)は歩(ある)きづらい。","Sepatu ini sulit dipakai berjalan."]],"n":"Lebih ke perasaan tidak enak daripada ～にくい."},{"t":"～てからでないと","r":"V て + からでないと (からでなければ)","m":"Kalau belum ..., tidak bisa ...","ex":[["確認(かくにん)してからでないと、返事(へんじ)できない。","Kalau belum dicek, saya tidak bisa menjawab."],["親(おや)に相談(そうだん)してからでないと、決(き)められない。","Kalau belum berunding dengan orang tua, saya tidak bisa memutuskan."]],"n":"Bagian belakang bernada negatif."},{"t":"～たところ","r":"V bentuk た + ところ","m":"Ketika dicoba, ternyata ...","ex":[["先生(せんせい)に聞(き)いたところ、すぐに分(わ)かった。","Ketika saya tanya guru, langsung ketahuan."],["会社(かいしゃ)に電話(でんわ)したところ、もう帰(かえ)ったと言(い)われた。","Ketika menelepon kantor, dikatakan dia sudah pulang."]],"n":"Hasilnya berupa kenyataan baru, bukan kemauan."},{"t":"～てはじめて","r":"V て + はじめて","m":"Baru setelah ... barulah ...","ex":[["失(うしな)って初(はじ)めて、その大切(たいせつ)さが分(わ)かった。","Baru setelah kehilangan, saya paham pentingnya."],["病気(びょうき)になって初(はじ)めて、健康(けんこう)のありがたさを知(し)った。","Baru setelah sakit, saya tahu berharganya kesehatan."]],"n":"Menekankan bahwa pemahaman datang setelah pengalaman."}]},{"g":"Batasan & Pengecualian","items":[{"t":"～に限(かぎ)って","r":"Nomina + に限って","m":"Justru pada ... (kebetulan buruk); hanya ... yang pasti tidak.","ex":[["急(いそ)いでいるときに限(かぎ)って、電車(でんしゃ)が遅(おく)れる。","Justru saat terburu-buru, kereta terlambat."],["うちの子(こ)に限(かぎ)って、うそはつかない。","Anak saya tidak mungkin berbohong."]],"n":"Dua arti: kesialan kebetulan, dan keyakinan terhadap orang dekat."},{"t":"～に限(かぎ)り","r":"Nomina + に限り","m":"Hanya terbatas pada ... (pengumuman).","ex":[["本日(ほんじつ)に限(かぎ)り、半額(はんがく)です。","Hanya hari ini, setengah harga."],["先着(せんちゃく)十名様(じゅうめいさま)に限(かぎ)り、無料(むりょう)です。","Gratis hanya untuk sepuluh orang pertama."]],"n":"Gaya iklan dan pengumuman."},{"t":"～限(かぎ)り","r":"V kamus / V ている / V た + 限り (Nomina: ～の限り)","m":"Sejauh, selama (batas cakupan).","ex":[["私(わたし)の知(し)る限(かぎ)り、そんな店(みせ)はない。","Sejauh yang saya tahu, tidak ada toko seperti itu."],["見(み)た限(かぎ)りでは、問題(もんだい)はなさそうだ。","Sejauh yang kulihat, sepertinya tidak ada masalah."]],"n":"Beda dengan ～ない限り (selama tidak ...)."},{"t":"～を除(のぞ)いて","r":"Nomina + を除いて / を除き","m":"Kecuali ...","ex":[["日曜日(にちようび)を除(のぞ)いて、毎日(まいにち)営業(えいぎょう)している。","Buka setiap hari kecuali hari Minggu."],["数人(すうにん)を除(のぞ)いて、全員(ぜんいん)が賛成(さんせい)した。","Kecuali beberapa orang, semuanya setuju."]],"n":"Bentuk yang lebih bernuansa tulisan: ～を除き."},{"t":"～のみ","r":"Nomina + のみ","m":"Hanya (formal, tulisan).","ex":[["関係者(かんけいしゃ)のみ入場(にゅうじょう)できます。","Hanya pihak terkait yang boleh masuk."],["当店(とうてん)は現金(げんきん)のみ使(つか)えます。","Toko kami hanya menerima tunai."]],"n":"Sama dengan だけ, tetapi lebih formal."},{"t":"～に至(いた)るまで","r":"Nomina + に至るまで","m":"Sampai ke ... (termasuk hal terkecil).","ex":[["髪(かみ)の色(いろ)から服装(ふくそう)に至(いた)るまで、細(こま)かく決(き)められている。","Dari warna rambut sampai pakaian, semuanya diatur rinci."],["子供(こども)からお年寄(としよ)りに至(いた)るまで、みんなが楽(たの)しめる。","Dari anak-anak hingga lansia, semua bisa menikmati."]],"n":"Sering berpasangan dengan ～から."},{"t":"～というものではない","r":"Bentuk biasa + というものではない","m":"Tidak berarti selalu ...","ex":[["高(たか)ければいいというものではない。","Bukan berarti asal mahal pasti bagus."],["練習(れんしゅう)すれば上手(じょうず)になるというものではない。","Tidak selalu berlatih berarti jadi mahir."]],"n":"Menolak anggapan umum."},{"t":"～ばかり","r":"V て + ばかりいる / Nomina + ばかり","m":"Hanya terus melakukan ... (celaan).","ex":[["遊(あそ)んでばかりいないで、勉強(べんきょう)しなさい。","Jangan main terus, belajarlah."],["彼(かれ)は文句(もんく)ばかり言(い)っている。","Dia hanya mengeluh terus."]],"n":"Bernuansa menegur."}]},{"g":"Ungkapan Formal & Bisnis","items":[{"t":"～ところを","r":"V ている / Adj-i / V た + ところを","m":"Pada saat ... (basa-basi sopan).","ex":[["お忙(いそが)しいところ、ありがとうございます。","Terima kasih di tengah kesibukan Anda."],["お休(やす)みのところを、申(もう)し訳(わけ)ありません。","Mohon maaf mengganggu waktu istirahat Anda."]],"n":"Dipakai sebagai ungkapan sopan dalam bisnis."},{"t":"～にあたって","r":"Nomina / V kamus + にあたって","m":"Pada saat akan melakukan (hal penting). Formal.","ex":[["新(あたら)しい仕事(しごと)を始(はじ)めるにあたって、準備(じゅんび)が必要(ひつよう)だ。","Saat memulai pekerjaan baru, persiapan diperlukan."],["開会(かいかい)にあたって、一言(ひとこと)ご挨拶(あいさつ)いたします。","Pada pembukaan acara, izinkan saya menyampaikan sepatah kata."]],"n":"Sama dengan ～に際して, untuk momen yang penting."},{"t":"～をめぐって","r":"Nomina + をめぐって","m":"Seputar (perdebatan, pertikaian).","ex":[["新(あたら)しい法律(ほうりつ)をめぐって、議論(ぎろん)が続(つづ)いている。","Perdebatan seputar undang-undang baru terus berlanjut."],["遺産(いさん)をめぐって、兄弟(きょうだい)が争(あらそ)っている。","Kakak beradik bertengkar soal warisan."]],"n":"Selalu dengan topik yang diperdebatkan."},{"t":"～に先立(さきだ)って","r":"Nomina / V kamus + に先立って","m":"Sebelum (kegiatan penting). Formal.","ex":[["試験(しけん)に先立(さきだ)って、注意事項(ちゅういじこう)を説明(せつめい)します。","Sebelum ujian, saya jelaskan hal-hal yang perlu diperhatikan."],["工事(こうじ)に先立(さきだ)って、住民(じゅうみん)に説明(せつめい)が行(おこな)われた。","Sebelum pembangunan, penjelasan diberikan kepada warga."]],"n":"Menekankan persiapan yang dilakukan lebih dulu."},{"t":"～にかけては","r":"Nomina + にかけては","m":"Dalam hal ... (unggul).","ex":[["料理(りょうり)にかけては、彼女(かのじょ)にかなう人(ひと)はいない。","Dalam hal memasak, tidak ada yang menandingi dia."],["足(あし)の速(はや)さにかけては、彼(かれ)がクラスで一番(いちばん)だ。","Dalam hal kecepatan lari, dia nomor satu di kelas."]],"n":"Selalu untuk kemampuan yang menonjol."},{"t":"～上(うえ)で","r":"V た / Nomina の + 上で; V kamus / Nomina の + 上で","m":"Setelah ...; dalam hal, saat melakukan ...","ex":[["よく考(かんが)えた上(うえ)で、決(き)めてください。","Putuskan setelah dipikirkan baik-baik."],["仕事(しごと)を進(すす)める上(うえ)で、大切(たいせつ)なことがある。","Ada hal penting dalam menjalankan pekerjaan."]],"n":"Dua arti: urutan (bentuk た) dan “dalam hal” (bentuk kamus)."},{"t":"～に沿(そ)って","r":"Nomina + に沿って","m":"Sesuai dengan (pedoman, rencana); menyusuri.","ex":[["計画(けいかく)に沿(そ)って、作業(さぎょう)を進(すす)める。","Pekerjaan dijalankan sesuai rencana."],["川(かわ)に沿(そ)って、道(みち)が続(つづ)いている。","Jalan membentang menyusuri sungai."]],"n":"Bentuk penjelas nomina: ～に沿った + Nomina."},{"t":"～に加(くわ)えて","r":"Nomina / Bentuk biasa + のに加えて","m":"Selain itu, ditambah ...","ex":[["給料(きゅうりょう)に加(くわ)えて、ボーナスも出(で)る。","Selain gaji, ada juga bonus."],["雨(あめ)に加(くわ)えて、風(かぜ)も強(つよ)くなってきた。","Ditambah hujan, angin pun menjadi kencang."]],"n":"Menambahkan hal yang sejenis."}]},{"g":"Kemungkinan & Penegasan","items":[{"t":"～得(う)る","r":"V bentuk ます (tanpa ます) + 得る / 得ない","m":"Mungkin terjadi / tidak mungkin terjadi.","ex":[["それは十分(じゅうぶん)あり得(う)ることだ。","Hal itu sangat mungkin terjadi."],["そんなことは考(かんが)え得(え)ない。","Hal seperti itu tidak terpikirkan."]],"n":"Bacaan: 得る = うる, 得ない = えない."},{"t":"～かのようだ","r":"Bentuk biasa + かのようだ / かのように","m":"Seakan-akan (padahal tidak).","ex":[["彼(かれ)は何(なに)も知(し)らないかのように、話(はな)している。","Dia bicara seakan-akan tidak tahu apa-apa."],["まるで夢(ゆめ)を見(み)ているかのようだ。","Seperti sedang bermimpi."]],"n":"Sering didampingi まるで."},{"t":"～ことになっている","r":"V kamus / V ない + ことになっている","m":"Sudah ditentukan (aturan, jadwal, kebiasaan).","ex":[["この寮(りょう)では、夜十時(よるじゅうじ)以降(いこう)は静(しず)かにすることになっている。","Di asrama ini, setelah pukul sepuluh malam harus tenang."],["日本(にほん)では、靴(くつ)を脱(ぬ)いで家(いえ)に入(はい)ることになっている。","Di Jepang, masuk rumah harus melepas sepatu."]],"n":"Aturan atau kebiasaan umum yang sudah ditetapkan."},{"t":"～ようとしない","r":"V bentuk volisional + (よ)うとしない","m":"Tidak mau (mencoba) melakukan ...","ex":[["彼(かれ)は私(わたし)の話(はなし)を聞(き)こうとしない。","Dia tidak mau mendengarkan ceritaku."],["子供(こども)が薬(くすり)を飲(の)もうとしない。","Anak itu tidak mau minum obat."]],"n":"Subjeknya biasanya orang ketiga."},{"t":"～ことか","r":"Bentuk biasa (Adj-na: ～な) + ことか","m":"Betapa ... (emosi kuat).","ex":[["どんなに嬉(うれ)しかったことか。","Betapa senangnya!"],["何度(なんど)言(い)ったことか。","Entah sudah berapa kali kukatakan!"]],"n":"Sering dengan どんなに / 何度."},{"t":"～ものがある","r":"Bentuk biasa (Adj-na: ～な) + ものがある","m":"Ada sesuatu yang ... (kesan kuat).","ex":[["彼(かれ)の演奏(えんそう)には、人(ひと)の心(こころ)を打(う)つものがある。","Permainannya punya sesuatu yang menyentuh hati."],["この絵(え)には、心(こころ)に迫(せま)るものがある。","Lukisan ini punya sesuatu yang menggetarkan hati."]],"n":"Penilaian subjektif yang berkesan."},{"t":"～というわけだ","r":"Bentuk biasa + というわけだ","m":"Dengan kata lain, jadi begitu.","ex":[["つまり、彼(かれ)は来(こ)ないというわけだ。","Jadi, dengan kata lain dia tidak akan datang."],["要(よう)するに、全部(ぜんぶ)私(わたし)の責任(せきにん)だというわけだ。","Singkatnya, semua dianggap tanggung jawab saya."]],"n":"Dipakai untuk merangkum atau menyimpulkan."},{"t":"～わけだ","r":"Bentuk biasa (Adj-na: ～な, Nomina: ～の) + わけだ","m":"Pantas, jadi begitu (kesimpulan logis).","ex":[["雨(あめ)が降(ふ)っていたから、道(みち)が濡(ぬ)れているわけだ。","Pantas jalannya basah, ternyata tadi hujan."],["十年(じゅうねん)も日本(にほん)にいたのか。道理(どうり)で日本語(にほんご)が上手(じょうず)なわけだ。","Sudah sepuluh tahun di Jepang? Pantas bahasa Jepangnya bagus."]],"n" function zGo(){const zs=$('#zs');if(zs)ZC.s=zs.value;Z.exam=0;if(ZC.t[0]==='v')return vGo();const n=ZC.n,t=ZC.t,s=ZC.s,pool=s==='all'?KJ:s==='hard'?KJ.filter(k=>S.hd['k'+k.k]):s.startsWith('t:')?(TH().find(t=>t.n===s.slice(2))||{k:[]}).k:KJ.filter(k=>k.sec===s);let it;
if(t==='bun')it=shuf(D.bq.map((_,i)=>i)).slice(0,n).map(bunQ);
else if(t==='bm'){const P=s==='all'?BPL:D.bp[+s].items;it=shuf(P).slice(0,n).map(p=>{const m=mk(p.t,P.map(x=>x.t),BPL.map(x=>x.t));return{h:`Pola mana yang artinya: <b>${esc(p.m)}</b>`,o:m.o.map(rb),k:m.k,st:'bp',sec:'Pola',say:m.o[m.k]}})}
else if(t==='bs'||t==='dg'){const P=s==='all'?BPL:D.bp[+s].items;it=shuf(P).slice(0,n).map(p=>{const e=shuf(p.ex)[0];if(t==='bs'){const m=mk(p.t,P.map(x=>x.t),BPL.map(x=>x.t));return{h:`Kalimat ini memakai pola apa?<div class='q'>${rb(e[0])}</div>`,o:m.o.map(rb),k:m.k,st:'bp',sec:'Pola',say:e[0],rev:esc(e[1])}}const m=mk(e[1],P.flatMap(x=>x.ex.map(y=>y[1])),BPL.flatMap(x=>x.ex.map(y=>y[1])));return{h:`<div style='text-align:center'>${sayBtn(e[0])}<p class='mu'>Ketuk speaker, dengarkan, lalu pilih artinya.</p></div>`,o:m.o.map(esc),k:m.k,st:'bp',sec:'Dengar',rev:rb(e[0])}})}
else if(!pool.length){toast('Daftar sulit masih kosong. Tandai dulu beberapa kanji.');return}

else if(t==='bc')it=shuf(pool.flatMap(k=>k.v)).slice(0,n).map(w=>rdQ(w,pool));

Z.items=it;Z.i=0;Z.ok=0;qdraw()}

const PK={1:{min:105,cm:50,ch:[{s:'Pemahaman tugas',au:[['F','すみません、来週の会議の資料、まだできていないんですが。'],['M','そうですか。じゃあ、先に会議室の予約を済ませてもらえますか。資料は午後でいいですから。'],['F','わかりました。'],['N','女の人は、このあとまず何をしますか。']],q:[["女(おんな)の人(ひと)は、このあとまず何(なに)をしますか。","会議室(かいぎしつ)を予約(よやく)する","資料(しりょう)を作(つく)る","プロジェクターを買(か)う","会議(かいぎ)を延期(えんき)する"]]},{s:'Pemahaman tugas',au:[['M','すみません、この本、返却したいんですが。'],['F','はい。期限が昨日までですね。延滞料金が百円かかりますが。'],['M','あ、そうですか。じゃあ、払います。'],['F','では、先にこちらの用紙に名前を書いてください。お金はそのあとで。'],['N','男の人は、このあとまず何をしますか。']],q:[["男(おとこ)の人(ひと)は、このあとまず何(なに)をしますか。","用紙(ようし)に名前(なまえ)を書(か)く","百円(ひゃくえん)を払(はら)う","本(ほん)を探(さが)す","期限(きげん)を延(の)ばす"]]},{s:'Pemahaman poin',au:[['F','ずいぶん疲れてるね。昨日、遅くまで勉強してたの？'],['M','いや、勉強じゃなくて、隣の部屋がうるさくて、全然眠れなかったんだ。'],['F','それは大変。管理人さんに言ったら？'],['M','うん、今日言ってみる。'],['N','男の人が疲れている理由は何ですか。']],q:[["男(おとこ)の人(ひと)が疲(つか)れている理由(りゆう)は何(なん)ですか。","隣(となり)の部屋(へや)がうるさかったから","遅(おそ)くまで勉強(べんきょう)したから","病気(びょうき)だから","仕事(しごと)が忙(いそが)しいから"]]},{s:'Pemahaman poin',au:[['F','田中さん、新しいレストランに行ってみた？'],['M','うん、先週。料理はおいしかったけど、ちょっと値段が高かったな。'],['F','サービスはどうだった？'],['M','それは最高だったよ。でも、また行くかどうかは迷うな。'],['N','男の人がまた行くかどうか迷っているのはなぜですか。']],q:[["男(おとこ)の人(ひと)が迷(まよ)っているのはなぜですか。","値段(ねだん)が高(たか)いから","料理(りょうり)がおいしくないから","サービスが悪(わる)いから","店(みせ)が遠(とお)いから"]]},{s:'Garis besar',au:[['F','最近、電子書籍を読む人が増えていますが、私は紙の本のほうが好きです。電子書籍は軽くて便利ですが、紙の本は、ページをめくる感じや、本棚に並べる楽しみがあります。本は、ただ読むだけのものではないと思うのです。'],['N','女の人は、紙の本についてどう思っていますか。']],q:[["女(おんな)の人(ひと)は、紙(かみ)の本(ほん)についてどう思(おも)っていますか。","読(よ)む以外(いがい)の楽(たの)しみもある","重(おも)くて不便(ふべん)だ","電子書籍(でんししょせき)より安(やす)い","場所(ばしょ)を取(と)るのでよくない"]]},{s:'Garis besar',au:[['M','来月から、駅前の駐輪場が有料になります。これまで無料でしたが、放置された自転車が増えて、歩く人が通りにくくなったためです。料金は一日百円で、一か月分をまとめて払うと、少し安くなります。'],['N','駐輪場が有料になる理由は何ですか。']],q:[["駐輪場(ちゅうりんじょう)が有料(ゆうりょう)になる理由(りゆう)は何(なん)ですか。","放置(ほうち)自転車(じてんしゃ)が増(ふ)えて困(こま)るから","駅(えき)が新(あたら)しくなるから","利用(りよう)する人(ひと)が減(へ)ったから","市(し)にお金(かね)がないから"]]},{s:'Respons cepat',k:0,au:[['M','先日はお世話になりました。'],['N','いち。いいえ、こちらこそ。'],['N','に。はい、お待たせしました。'],['N','さん。ええ、もうすぐ着きます。']]},{s:'Respons cepat',k:2,au:[['F','この資料、コピーしておいてもらえませんか。'],['N'
